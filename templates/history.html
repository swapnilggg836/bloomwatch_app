{% extends "base.html" %}
{% block content %}
<h2>History</h2>
<table>
<tr><th>ID</th><th>Filename</th><th>Summary</th><th>Date</th></tr>
{% for r in records %}
  <tr>
    <td>{{ r[0] }}</td>
    <td>{{ r[1] }}</td>
    <td>{{ r[2][:100] }}...</td>
    <td>{{ r[3] }}</td>
  </tr>
{% endfor %}
</table>
{% endblock %}
